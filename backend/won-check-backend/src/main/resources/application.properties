spring.application.name=won-check-backend
# Local settings, resolved from the process working directory.
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}
woncheck.mode=${WONCHECK_MODE:mock}
woncheck.openai.api-key=${OPENAI_API_KEY:}
woncheck.openai.chat-model=${OPENAI_CHAT_MODEL:${LLM_MODEL:gpt-4o-mini}}
woncheck.openai.embedding-model=${EMBEDDING_MODEL:text-embedding-3-small}
woncheck.chroma.url=${CHROMA_URL:http://localhost:8000}
woncheck.chroma.collection=${CHROMA_COLLECTION:disclosures}

# Relative to the backend/ working directory when launched with ./gradlew bootRun
# Override with absolute path if IntelliJ uses a different working directory.
woncheck.data.path=${WONCHECK_DATA_PATH:../data}
# Enable ONLY for isolated mock tests using the bundled, unverified sample JSON.
woncheck.data.allow-sample-fallback=${WONCHECK_ALLOW_SAMPLE_FALLBACK:false}

# React/Vite local origin; override for deployed frontend
woncheck.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
# Applies to both chat and embedding calls. Mock mode skips these calls.
woncheck.llm.provider=${LLM_PROVIDER:openai}
woncheck.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
woncheck.ollama.chat-model=${OLLAMA_CHAT_MODEL:}
woncheck.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:}
